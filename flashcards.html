async function loadLink() {
  const v = view;
  if (!Cloud.sb) { view.error = 'Geen verbinding.'; render(); return; }
  const { data, error } = await Cloud.sb.rpc('get_share_link', { t: v.token });
  if (view !== v) return;
  view.data = data && data[0]; view.error = error ? 'Deze link werkt niet.' : (!view.data ? 'Deze link bestaat niet (meer).' : '');
  render();
}
function renderLink() {
  if (!view.data && !view.error) return backBar('Gedeelde link') + '<p class="muted center">Laden…</p>';
  if (view.error) return backBar('Gedeelde link') + `<section class="panel"><div class="empty"><p class="muted">${esc(view.error)}</p><button class="btn" data-act="home">Naar mijn sets</button></div></section>`;
  const l = view.data, p = l.payload || {};
  const dl = p.type === 'folder' ? p.decks || [] : [p.deck].filter(Boolean);
  const cards = dl.reduce((a, d) => a + (d.cards || []).length, 0);
  return backBar('Gedeelde link') + `<section class="panel"><div class="card-box center">
    ${avatar(l.username, true)}
    <p><b>@${esc(l.username)}</b> deelt ${p.type === 'folder' ? 'de map' : 'de set'}</p>
    <h2>${esc(l.item_name)}</h2>
    <p class="muted">${p.type === 'folder' ? plural(dl.length, 'set', 'sets') + ' · ' : ''}${plural(cards, 'kaart', 'kaarten')}</p>
    <button class="btn primary block" data-act="import-link">Toevoegen aan mijn app</button>
    <p class="muted small">Je krijgt een eigen kopie die je zelf kunt aanpassen.</p></div></section>`;
}
function importPayload(p) {
  const addDeck = (x, folderId) => {
    const d = makeDeck(x.name, x.n || 2, (x.names || DEFAULT_NAMES).slice(0, x.n || 2), (x.cards || []).map(s => Array.from({ length: x.n || 2 }, (_, i) => s[i] || '')));
    if (Array.isArray(x.langs)) d.langs = x.langs.slice(0, d.n);
    if (x.opt) d.opt = { ...d.opt, ...x.opt };
    d.folder = folderId || ''; decks.push(d); Store.touch(d); return d;
  };
  if (p.type === 'folder') { const f = createFolder(p.name || 'Gedeelde map', p.c); (p.decks || []).forEach(x => addDeck(x, f.id)); homeFolder = f.id; return f.name; }
  if (p.deck) { addDeck(p.deck, ''); return p.deck.name; }
  return '';
}
function handleHash() {
  if (!ONLINE) return false;
  const m = location.hash.match(/^#(link|friend)=([A-Za-z0-9_.\-]+)$/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  if (m[1] === 'link') { view = { name: 'link', token: m[2] }; render(); loadLink(); return true; }
  if (Cloud.user) { openProfileByName(m[2]); return true; }
  view = { name: 'auth', mode: 'signup', pendingFriend: m[2], error: '' }; render(); return true;
}

/* ---------- Forms & inputs for the online screens ---------- */
app.addEventListener('submit', async e => {
  const form = e.target.closest('form'); if (!form) return;
  const kind = form.dataset.form;
  if (!['login', 'signup', 'reset', 'newpass', 'chat', 'comment', 'card-comment'].includes(kind)) return;
  e.preventDefault();
  const val = id => (document.getElementById(id) || {}).value || '';
  if (kind === 'chat') { Chat.send(); return; }
  if (kind === 'comment' || kind === 'card-comment') {
    const isCard = kind === 'card-comment';
    const obj = isCard ? getDeck(session.deckId) : itemOf(view.kind, view.id);
    const body = val(isCard ? 'cc-body' : 'c-body').trim(); if (!body || !obj) return;
    const sugg = (document.getElementById(isCard ? 'cc-sugg' : 'c-sugg') || {}).checked;
    const card = isCard ? (currentCard() || {}).id || null : null;
    const { data, error } = await Cloud.sb.rpc('add_comment', { p_owner: obj.owner, p_kind: isCard ? 'deck' : view.kind, p_item: obj.srcId, p_card: card, p_body: body, p_suggestion: !!sugg });
    if (error || data !== 'sent') { toast('Versturen lukte niet. Probeer opnieuw.'); return; }
    toast('Verstuurd naar de eigenaar ✓');
    if (isCard) { session.commenting = false; render(); } else loadItem();
    return;
  }
  const email = val('a-email'), pass = val('a-pass'), uname = val('a-user');
  view.email = email; view.username = uname;
  view.busy = true; view.error = ''; render();
  let err = null;
  try {
    if (kind === 'login') err = await Cloud.signIn(email, pass);
    else if (kind === 'signup') err = await Cloud.signUp(email, pass, uname);
    else if (kind === 'reset') {
      const { error } = await Cloud.sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: appUrl() });
      err = error ? authError(error) : null;
      if (!err) { view = { name: 'auth', mode: 'login' }; render(); toast('Check je mailbox voor de link.'); return; }
    } else if (kind === 'newpass') {
      const { error } = await Cloud.sb.auth.updateUser({ password: pass });
      err = error ? authError(error) : null;
      if (!err) { toast('Nieuw wachtwoord opgeslagen'); const { data } = await Cloud.sb.auth.getSession(); if (data.session && !Cloud.user) await Cloud.start(data.session.user); view = { name: 'home' }; render(); return; }
    }
  } catch (ex) { err = authError(ex); }
  if (err) { view.busy = false; view.error = err; render(); return; }
  toast(kind === 'signup' ? `Welkom, @${Cloud.me.username}! 🎉` : `Welkom terug, @${Cloud.me.username}`);
  afterLogin();
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'a-user') checkUsername(t.value);
  else if (t.id === 'f-search') searchPeople(t.value);
  else if (t.id === 'chat-input') view.draft = t.value;
});

let lastPull = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { Store.flush(); return; }
  if (Store.mode === 'supa') {
    // Back in the app: pick up changes made on your other devices or by friends
    if (Date.now() - lastPull < 30000) { Cloud.refreshCounts().catch(() => {}); return; }
    lastPull = Date.now();
    try { await Cloud.settle(); await Cloud.pullOwn(); await Cloud.loadShared(); await Cloud.refreshSocial(); } catch (e) { /* offline */ }
    if (view.name === 'home' && !view.newFolder && !view.rename) render(); else updateBadges();
    return;
  }
  if (view.name === 'home' && !view.newFolder && !view.rename && await Store.refresh()) render();
});

/* ---------- links from Planning: #study=<set>, #new, #auth ---------- */
let pendingStudy = null;
function handleAppHash(final) {
  const h = location.hash, clear = () => history.replaceState(null, '', location.pathname + location.search);
  const m = h.match(/^#study=(.+)$/);
  if (m || pendingStudy) {
    const id = m ? decodeURIComponent(m[1]) : pendingStudy;
    if (m) clear();
    if (getDeck(id)) { pendingStudy = null; startStudy(id); return true; }
    pendingStudy = final ? null : id;
    if (final) toast('Deze set staat niet op dit toestel. Log in om je sets te zien.');
    return false;
  }
  if (h === '#new') { clear(); startWizard(null, ''); return true; }
  if (h === '#auth') { clear(); if (ONLINE && Cloud.sb && !Cloud.user) { view = { name: 'auth', mode: 'login' }; render(); return true; } if (!final) { pendingAuth = true; } return false; }
  if (pendingAuth && final) { pendingAuth = false; if (ONLINE && Cloud.sb && !Cloud.user) { view = { name: 'auth', mode: 'login' }; render(); return true; } }
  return false;
}
let pendingAuth = false;

/* ---------- boot ---------- */
Store.tombs = Store.loadTombs();
Store.loadFolders();
decks = Store.loadLocal().filter(d => d && d.id && Array.isArray(d.cards) && !Store.tombs.has(d.id));
Stats.load();
if (ONLINE && lsGet(LS_OWNER, null)) Cloud.loadSharedLocal();
render();
handleAppHash(false);
if (window.claude) {
  Store.initCloud().then(changed => { if (view.name === 'home' && !view.newFolder && !view.rename) render(); else updateSyncChip(); });
} else {
  Cloud.init().then(() => {
    lastPull = Date.now();
    if (handleHash()) return;
    if (handleAppHash(true)) return;
    if (view.name === 'home' && !view.newFolder && !view.rename) render(); else updateBadges();
  });
}

// Stand-alone version (own website): work offline and keep data safe
if (!window.claude) {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* no offline mode */ });
    // A new version was installed: reload once so everyone gets it right away
    let reloaded = false;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded || view.name === 'study' || view.name === 'new') return;
      reloaded = true; location.reload();
    });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (view.name === 'home') render(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; toast('Uni Study is geïnstalleerd'); if (view.name === 'home') render(); });
}
</script>
</body>
</html>
