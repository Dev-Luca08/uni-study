<style>
/* Layout: one mobile-first column (max 680px); study view is a full-height card stage with answer buttons at the thumb. Cards look like ruled index cards. */
:root {
  --bg: #E8ECF1;
  --surface: #FFFFFF;
  --surface-2: #F3F5F8;
  --ink: #16202B;
  --muted: #586473;
  --line: #D2D9E2;
  --accent: #1F3FB5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E7FA;
  --rule-red: #E36D6D;
  --rule-blue: #D3DEEE;
  --again: #C2352B;
  --again-soft: #FBE6E4;
  --hard: #A86A00;
  --hard-soft: #FBF0DA;
  --good: #1C8248;
  --good-soft: #DFF2E6;
  --shadow: 0 1px 2px rgba(18, 30, 52, .06), 0 10px 28px rgba(18, 30, 52, .09);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  /* folder colours */
  --f0: #2F55D4; --f1: #1E8A4C; --f2: #C77D00; --f3: #C2352B; --f4: #7B4BC9; --f5: #0E8C96;
  --f6: #C2417F; --f7: #D2601A; --f8: #5B6675; --f9: #6E8B12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #1A2029; --surface-2: #222A35; --ink: #E6EBF1; --muted: #9AA6B4; --line: #2F3947;
    --accent: #93A7FF; --accent-ink: #0D1330; --accent-soft: #232C4B; --rule-red: #9C4448; --rule-blue: #263247;
    --again: #FF8277; --again-soft: #3B1F1E; --hard: #F1B14B; --hard-soft: #3A2E15; --good: #55CC86; --good-soft: #163222;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    --f0: #8FA4FF; --f1: #55CC86; --f2: #F1B14B; --f3: #FF8277; --f4: #B892FF; --f5: #4CC9D2;
    --f6: #FF86C0; --f7: #FFA463; --f8: #AAB4C2; --f9: #B5D95A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #1A2029; --surface-2: #222A35; --ink: #E6EBF1; --muted: #9AA6B4; --line: #2F3947;
  --accent: #93A7FF; --accent-ink: #0D1330; --accent-soft: #232C4B; --rule-red: #9C4448; --rule-blue: #263247;
  --again: #FF8277; --again-soft: #3B1F1E; --hard: #F1B14B; --hard-soft: #3A2E15; --good: #55CC86; --good-soft: #163222;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    --f0: #8FA4FF; --f1: #55CC86; --f2: #F1B14B; --f3: #FF8277; --f4: #B892FF; --f5: #4CC9D2;
    --f6: #FF86C0; --f7: #FFA463; --f8: #AAB4C2; --f9: #B5D95A;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 680px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; text-decoration: none; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .9375rem; }
.btn.block { width: 100%; white-space: normal; text-align: center; padding-block: 8px; }
.empty > *, .panel > *, .card-box > *, .decks > * { min-width: 0; }
.btn.danger { color: var(--again); border-color: color-mix(in srgb, var(--again) 40%, var(--line)); }
.btn.danger.solid { background: var(--again); color: #fff; border-color: var(--again); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid transparent; background: transparent;
  display: inline-grid; place-items: center; font-size: 1.25rem; flex: none;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 8px; padding-block: 14px 10px; }
.bar h1 { font-size: 1.35rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step { font-size: .8125rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

/* Home */
.home-head { padding-block: 26px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 44px; height: 44px; flex: none; }
.brand h1 { font-size: clamp(1.6rem, 7vw, 2rem); font-weight: 800; letter-spacing: -.02em; }
.brand p { color: var(--muted); font-size: .9375rem; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: .8125rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.cloud i { background: var(--good); }
.sync.error i { background: var(--again); }
.sync.connecting i { background: var(--hard); }
.home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.home-actions:has(> :only-child) { grid-template-columns: 1fr; }
.new-btn { min-height: 54px; font-size: 1.0625rem; white-space: normal; text-align: center; line-height: 1.2; }
.folder-form { margin-bottom: 18px; }
.folder-tools { margin: -8px 0 14px; }
.decks { display: grid; gap: 12px; }
.decks + .section-title, .folders + .section-title { margin-top: 22px; }
.section-title + .folders, .section-title + .decks { margin-top: 8px; }
/* Folder tiles: a paper folder with a coloured tab */
.folders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 10px; }
.folder { position: relative; text-align: left; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; background: color-mix(in srgb, var(--fc) 12%, var(--surface)); padding: 16px 14px 14px; display: grid; gap: 2px; min-height: 112px; align-content: start; box-shadow: var(--shadow); }
.folder-tab { position: absolute; left: -1px; top: -11px; width: 58px; height: 12px; border-radius: 6px 10px 0 0; background: var(--fc); }
.folder-name { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.2; overflow-wrap: anywhere; }
.folder-meta { font-size: .8125rem; color: var(--muted); }
.folder-todo { font-size: .8125rem; margin-top: 6px; }
.folder-title { display: flex; align-items: center; gap: 10px; }
.folder-title i { width: 14px; height: 14px; border-radius: 4px; background: var(--fc); flex: none; }
.c0 { --fc: var(--f0); } .c1 { --fc: var(--f1); } .c2 { --fc: var(--f2); } .c3 { --fc: var(--f3); } .c4 { --fc: var(--f4); } .c5 { --fc: var(--f5); }
.c6 { --fc: var(--f6); } .c7 { --fc: var(--f7); } .c8 { --fc: var(--f8); } .c9 { --fc: var(--f9); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface); background: var(--fc); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.color-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: -4px 0 16px; }
.color-row .lbl { font-size: .875rem; color: var(--muted); }
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.deck-main { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 16px 16px 12px; }
.deck-main h2 { font-size: 1.25rem; margin-bottom: 4px; overflow-wrap: anywhere; }
.deck .meta { color: var(--muted); font-size: .875rem; overflow-wrap: anywhere; }
.meter { display: flex; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 12px 0 8px; }
.meter span { display: block; height: 100%; }
.meter .m-known { background: var(--good); }
.meter .m-learn { background: var(--hard); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend b { color: var(--ink); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.k { background: var(--good); } .dot.l { background: var(--hard); } .dot.n { background: var(--line); }
.deck-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px 14px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.todo { font-size: .9375rem; }
.todo b { font-variant-numeric: tabular-nums; }
.deck-foot .acts { display: flex; gap: 8px; }

.empty { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.empty h2 { font-size: 1.3rem; }
.sheet-demo { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.sheet-demo table { border-collapse: collapse; width: 100%; font-size: .875rem; min-width: 460px; }
.sheet-demo th, .sheet-demo td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
.sheet-demo th { background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: .75rem; letter-spacing: .05em; }
.sheet-demo td.rn, .sheet-demo th.rn { width: 32px; text-align: center; color: var(--muted); background: var(--surface-2); }

.backup-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
.backup-row label { cursor: pointer; }
.zip-box { margin-top: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; }
.zip-box > div { flex: 1 1 220px; min-width: 0; }
.install-btn { margin-bottom: 16px; border-style: dashed; }
.install-tip { margin-bottom: 16px; font-size: .9375rem; background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; }
.footer { margin-top: auto; padding-block: 32px 22px; text-align: center; color: var(--muted); font-size: .875rem; }
.footer b { font-family: var(--font-display); color: var(--ink); font-weight: 600; }

/* Panels / forms */
.panel { display: grid; gap: 16px; padding-bottom: 28px; }
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
label.lbl, .lbl { font-weight: 700; font-size: .9375rem; }
.help { color: var(--muted); font-size: .875rem; margin-top: -6px; }
.field { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
textarea.field { min-height: 150px; resize: vertical; font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: .875rem; }
select.field { padding-right: 8px; }
input.field, select.field { height: 46px; min-height: 0; padding-block: 0; }
.card-row input.field { height: 40px; }
.sides-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick { border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 8px 12px; display: grid; justify-items: center; gap: 8px; text-align: center; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pick b { font-family: var(--font-display); font-size: 1.15rem; }
.pick small { color: var(--muted); font-size: .75rem; line-height: 1.3; }
.stack { position: relative; width: 56px; height: 44px; }
.stack span { position: absolute; width: 40px; height: 28px; border-radius: 5px; background: var(--surface); border: 1.5px solid var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 700; font-size: .875rem; color: var(--muted); padding: 0 4px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.drop { display: grid; place-items: center; gap: 6px; text-align: center; border: 2px dashed var(--line); border-radius: var(--r); padding: 34px 16px; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop strong { font-size: 1.05rem; }
.drop .big { font-size: 2rem; line-height: 1; }
.error { background: var(--again-soft); color: var(--again); border-radius: 10px; padding: 10px 12px; font-size: .9375rem; }
.warn { background: var(--hard-soft); color: var(--ink); border-left: 4px solid var(--hard); border-radius: 10px; padding: 10px 12px; font-size: .9375rem; display: grid; gap: 8px; }
.found { font-size: 1rem; }
.check { display: flex; gap: 10px; align-items: center; font-size: .9375rem; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.map-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: center; padding-top: 6px; border-top: 1px dashed var(--line); }
.map-row .num, .side-row .num { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.preview table { border-collapse: collapse; width: 100%; font-size: .875rem; }
.preview th, .preview td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 110px; }
.preview th { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.preview tr:last-child td { border-bottom: 0; }
.sticky-save { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* Edit */
.section-title { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 6px; }
.side-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: center; padding-top: 6px; border-top: 1px dashed var(--line); }
.side-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-head em { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--accent); }
.mover { display: inline-flex; gap: 4px; }
.icon-btn.sm-icon { width: 36px; height: 36px; font-size: 1rem; border: 1px solid var(--line); background: var(--surface-2); }
.swap-btn { justify-self: start; }
.order-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 700; }
.order-line span { background: var(--accent-soft); color: var(--accent); padding: 3px 10px; border-radius: 999px; font-size: .875rem; }
.order-line i { color: var(--muted); font-style: normal; }
.fixed { font-size: .875rem; color: var(--good); background: var(--good-soft); padding: 8px 12px; border-radius: 10px; }
.inline-new { display: flex; gap: 8px; }
.inline-new .field { flex: 1; min-width: 0; }
.drop.busy { opacity: .7; pointer-events: none; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts > div { display: grid; gap: 4px; }
.card-list { display: grid; gap: 8px; }
.card-row { display: grid; grid-template-columns: 28px 1fr 40px; gap: 8px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.card-row .idx { font-size: .75rem; color: var(--muted); text-align: center; padding-top: 12px; font-variant-numeric: tabular-nums; }
.card-row .fields { display: grid; gap: 6px; min-width: 0; }
.card-row .field { min-height: 40px; padding: 7px 10px; }
.card-row .st { font-size: .7rem; color: var(--muted); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.danger-zone { border-color: color-mix(in srgb, var(--again) 35%, var(--line)); }

/* Study */
.study { display: flex; flex-direction: column; min-height: 100%; flex: 1; }
.study .bar { padding-bottom: 6px; }
.study .title { flex: 1; min-width: 0; display: grid; }
.study .title b { font-family: var(--font-display); font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.counts { display: flex; gap: 12px; font-size: .8125rem; font-variant-numeric: tabular-nums; }
.counts .c-new { color: var(--accent); } .counts .c-learn { color: var(--again); } .counts .c-rev { color: var(--good); }
.progress { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 12px; position: relative; min-height: 0; }
.flash {
  position: relative; width: 100%; min-height: min(50vh, 420px); min-height: min(50dvh, 420px); border: 1px solid var(--line); border-radius: 16px;
  background-color: var(--surface);
  background-image:
    linear-gradient(to bottom, transparent 55px, var(--rule-red) 55px, var(--rule-red) 57px, transparent 57px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 33px, var(--rule-blue) 33px, var(--rule-blue) 34px);
  background-position: 0 0, 0 57px;
  background-repeat: no-repeat, repeat;
  box-shadow: var(--shadow); text-align: center; display: flex; flex-direction: column; padding: 0; overflow: hidden;
}
.flash.anim { animation: flipIn .22s ease-out; }
@keyframes flipIn { from { transform: perspective(900px) rotateY(-70deg); opacity: .4; } to { transform: none; opacity: 1; } }
.flash-top { height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 18px; gap: 8px; }
.side-label { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.chip.learn { background: var(--hard-soft); color: var(--hard); }
.chip.review { background: var(--good-soft); color: var(--good); }
.pip { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; }
.pip.on { background: currentColor; }
.flash-body { flex: 1; display: grid; place-items: center; padding: 20px 22px 12px; }
.flash-text { font-family: var(--font-body); font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.3; }
.flash-text.s1 { font-size: clamp(2rem, 8vw, 2.8rem); font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; }
.flash-text.s2 { font-size: clamp(1.5rem, 5.6vw, 2rem); }
.flash-text.s3 { font-size: 1.3rem; font-weight: 400; }
.flash-text.s4 { font-size: 1.05rem; font-weight: 400; text-align: left; }
.flash-text.blank { color: var(--muted); font-weight: 400; font-size: 1rem; }

<body>
<div id="app"></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =========================================================
   Uni Flashcards — made by Luca Cicarelli
   ========================================================= */

const LS_KEY = 'tarjeta.decks.v1';
const LS_TOMB = 'tarjeta.deleted.v1';
const LS_FOLDERS = 'tarjeta.folders.v1';
const DEFAULT_NAMES = ['Woord', 'Uitleg', 'Zin', 'Extra'];
const LANGS = [
  ['', 'Geen voorlezen'], ['es-ES', 'Spaans'], ['en-GB', 'Engels (UK)'], ['en-US', 'Engels (US)'],
  ['nl-BE', 'Nederlands'], ['fr-FR', 'Frans'], ['de-DE', 'Duits'], ['it-IT', 'Italiaans'], ['pt-PT', 'Portugees']
];
const HEADER_WORDS = ['spaans','spanish','espanol','castellano','engels','english','ingles','nederlands','dutch','vlaams','frans','french','frances','duits','german','aleman','italiaans','italian',
  'woord','woorden','word','words','palabra','palabras','vocabulario','zin','zinnen','sentence','sentences','frase','frases','oracion','ejemplo','ejemplos','voorbeeld','voorbeeldzin','example',
  'betekenis','meaning','uitleg','definitie','definition','significado','vertaling','translation','traduccion','term','begrip','vraag','antwoord','question','answer','front','back',
  'voorkant','achterkant','kant','side','kolom','column','extra','notitie','notes','opmerking'];

const app = document.getElementById('app');
let decks = [];
let folders = [];
let foldersUpdated = 0;
let view = { name: 'home' };
let session = null;
let wiz = null;

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[:.]+$/, '').trim();
const colLetter = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]); }
const getDeck = id => decks.find(d => d.id === id);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

function guessLang(name, i, langs) {
  const n = norm(name);
  if (/spa|espa|castell/.test(n)) return 'es-ES';
  if (/engl|ingl/.test(n)) return 'en-GB';
  if (/nederl|dutch|vlaams/.test(n)) return 'nl-BE';
  if (/frans|french|franc/.test(n)) return 'fr-FR';
  if (/duits|german|alem/.test(n)) return 'de-DE';
  if (/ital/.test(n)) return 'it-IT';
  if (/zin|frase|sentence|oracion|ejemplo|voorbeeld|example/.test(n)) return (langs && langs[0]) || 'es-ES';
  if (/uitleg|betekenis|meaning|defin|significado|vertaling|translation/.test(n)) return 'en-GB';
  return ['es-ES', 'en-GB', 'es-ES', ''][i] ?? '';
}

function newCard(sides) { return { id: uid(), s: sides, st: 'new', k: 0, iv: 0, due: 0, reps: 0, lapses: 0 }; }

function makeDeck(name, n, names, cardsSides) {
  const langs = [];
  names.forEach((nm, i) => langs.push(guessLang(nm, i, langs)));
  const now = Date.now();
  return {
    id: uid(), name: name || 'Nieuwe set', n, names, langs,
    cards: cardsSides.map(s => newCard(s)),
    created: now, updated: now, last: 0,
    opt: { newLimit: 30, start: 0, shuffle: true }
  };
}

function deckStats(d) {
  const t = today(); let nw = 0, lr = 0, kn = 0, due = 0, tomorrow = 0;
  for (const c of d.cards) {
    if (c.st === 'new') nw++;
    else if (c.st === 'learn') lr++;
    else { kn++; if (c.due <= t) due++; else if (c.due === t + 1) tomorrow++; }
  }
  const lim = d.opt?.newLimit || 0;
  const newToday = lim ? Math.min(nw, lim) : nw;
  return { nw, lr, kn, due, tomorrow, total: d.cards.length, newToday, todo: due + lr + newToday };
}

/* =========================================================
   Storage: this device (localStorage) + cloud sync (db)
   ========================================================= */
const Store = {
  mode: (window.claude && typeof window.claude.use === 'function') ? 'connecting' : 'local',
  db: null, col: null,
  written: new Map(), chunkCount: new Map(), timers: new Map(),
  chain: Promise.resolve(), tombs: new Set(), errorShown: false,

  loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); const v = raw ? JSON.parse(raw) : []; return Array.isArray(v) ? v : []; } catch (e) { return []; }
  },
  loadTombs() {
    try { const raw = localStorage.getItem(LS_TOMB); return new Set(raw ? JSON.parse(raw) : []); } catch (e) { return new Set(); }
  },
  loadFolders() {
    try { const raw = localStorage.getItem(LS_FOLDERS); const v = raw ? JSON.parse(raw) : null; if (v && Array.isArray(v.list)) { folders = v.list; foldersUpdated = v.updated || 0; } } catch (e) { /* none */ }
  },
  saveLocal() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(decks.filter(d => !d.ro)));
      localStorage.setItem(LS_TOMB, JSON.stringify([...this.tombs]));
      localStorage.setItem(LS_FOLDERS, JSON.stringify({ list: folders.filter(f => !f.ro), updated: foldersUpdated }));
    } catch (e) { /* storage blocked: keep in memory */ }
  },
  touchFolders() {
    foldersUpdated = Date.now();
    this.saveLocal();
    if (this.mode === 'supa') { Cloud.saveShared(); Cloud.scheduleFolders(); return; }
    if (this.mode !== 'cloud') return;
    clearTimeout(this.folderTimer);
    this.folderTimer = setTimeout(() => { this.folderTimer = null; this.queueFolders(); }, 600);
  },
  queueFolders() {
    const body = { kind: 'folders', list: folders, updated: foldersUpdated };
    this.chain = this.chain.then(async () => {
      const s = JSON.stringify(body);
      if (this.written.get('folders') === s) return;
      await this.write(() => this.col.doc('folders').set(body));
      this.written.set('folders', s);
    }).catch(e => this.fail(e));
  },

  async initCloud() {
    if (this.mode !== 'connecting') return false;
    try {
      const [db, user] = await withTimeout(Promise.all([claude.use('db'), claude.use('user')]), 12000);
      if (!db || !user) { this.mode = 'local'; return false; }
      const id = await user.id();
      if (!id) { this.mode = 'local'; return false; }
      this.db = db; this.col = db.collection('data/users/' + id);
      const cloud = await this.fetchCloud();
      this.mode = 'cloud';
      return this.merge(cloud);
    } catch (e) {
      this.mode = this.col ? 'error' : 'local';
      return false;
    }
  },

  async fetchCloud() {
    const snap = await withTimeout(this.col.get(), 12000);
    const metas = {}, chunks = {};
    for (const d of snap.docs) {
      const raw = d.data(); if (!raw) continue;
      const b = JSON.parse(JSON.stringify(raw));
      this.written.set(d.id, JSON.stringify(raw));
      if (b.kind === 'deck' && b.deck && b.deck.id) metas[b.deck.id] = b;
      else if (b.kind === 'cards') { (chunks[b.deckId] ||= [])[b.i] = b.cards || []; }
      else if (b.kind === 'tombs') { (b.ids || []).forEach(x => this.tombs.add(x)); }
      else if (b.kind === 'folders') this.cloudFolders = b;
    }
    const out = [];
    for (const id in metas) {
      const m = metas[id]; const cards = [];
      for (let i = 0; i < m.chunks; i++) cards.push(...((chunks[id] && chunks[id][i]) || []));
      out.push({ ...m.deck, cards });
      this.chunkCount.set(id, m.chunks);
    }
    return out;
  },

  merge(cloud) {
    const map = new Map();
    for (const d of cloud) if (!this.tombs.has(d.id)) map.set(d.id, d);
    const push = [];
    for (const d of decks) {
      if (this.tombs.has(d.id)) continue;
      const c = map.get(d.id);
      if (!c || (d.updated || 0) > (c.updated || 0)) { map.set(d.id, d); push.push(d.id); }
    }
    const before = JSON.stringify(decks.map(d => [d.id, d.updated])) + foldersUpdated;
    decks = [...map.values()];
    // Folders: newest list wins
    const cf = this.cloudFolders;
    let pushFolders = false;
    if (cf && (cf.updated || 0) > foldersUpdated) { folders = JSON.parse(JSON.stringify(cf.list || [])); foldersUpdated = cf.updated || 0; }
    else if (foldersUpdated && (!cf || foldersUpdated > (cf.updated || 0))) pushFolders = true;
    this.saveLocal();
    for (const id of push) this.queuePush(id);
    if (pushFolders) this.queueFolders();
    return before !== JSON.stringify(decks.map(d => [d.id, d.updated])) + foldersUpdated || push.length > 0;
  },

  async refresh() {
    if (this.mode !== 'cloud' || this.timers.size || this.folderTimer) return false;
    try { const cloud = await this.fetchCloud(); return this.merge(cloud); } catch (e) { return false; }
  },

  touch(deck) {
    if (deck.ro) { Cloud.saveShared(); if (this.mode === 'supa') Cloud.scheduleProgress(deck); return; }
    deck.updated = Date.now();
    this.saveLocal();
    if (this.mode === 'supa') { Cloud.scheduleDeck(deck.id); return; }
    if (this.mode !== 'cloud') return;
    clearTimeout(this.timers.get(deck.id));
    this.timers.set(deck.id, setTimeout(() => { this.timers.delete(deck.id); this.queuePush(deck.id); }, 900));
  },

  flush() {
    if (this.mode === 'supa') { Cloud.flush(); Stats.flush(); return; }
    for (const [id, t] of this.timers) { clearTimeout(t); this.queuePush(id); }
    this.timers.clear();
    if (this.folderTimer) { clearTimeout(this.folderTimer); this.folderTimer = null; this.queueFolders(); }
  },

  queuePush(id) { this.chain = this.chain.then(() => this.pushDeck(id)).catch(e => this.fail(e)); },

  docsFor(deck) {
    const { cards, ...meta } = deck;
    const chunks = []; let cur = [], size = 0;
    for (const c of cards) {
      const len = JSON.stringify(c).length;
      if (cur.length && size + len > 60000) { chunks.push(cur); cur = []; size = 0; }
      cur.push(c); size += len;
    }
    if (cur.length || !chunks.length) chunks.push(cur);
    const docs = chunks.map((c, i) => ['cards-' + deck.id + '-' + i, { kind: 'cards', deckId: deck.id, i, cards: c }]);
    docs.push(['deck-' + deck.id, { kind: 'deck', deck: meta, chunks: chunks.length, updated: deck.updated }]);
    return docs;
  },

  async write(fn) {
    try { await fn(); }
    catch (e) {
      if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await sleep(700 + Math.random() * 900); await fn(); }
      else throw e;
    }
  },

  async pushDeck(id) {
    if (this.mode !== 'cloud') return;
    const deck = getDeck(id); if (!deck) return;
    const docs = this.docsFor(deck);
    for (const [docId, body] of docs) {
      const s = JSON.stringify(body);
      if (this.written.get(docId) === s) continue;
      await this.write(() => this.col.doc(docId).set(body));
      this.written.set(docId, s);
    }
    const old = this.chunkCount.get(id) || 0, now = docs.length - 1;
    for (let i = now; i < old; i++) { const docId = 'cards-' + id + '-' + i; await this.write(() => this.col.doc(docId).delete()); this.written.delete(docId); }
    this.chunkCount.set(id, now);
    if (this.errorShown) { this.errorShown = false; updateSyncChip(); }
  },

  removeDeck(id) {
    this.tombs.add(id);
    decks = decks.filter(d => d.id !== id);
    clearTimeout(this.timers.get(id)); this.timers.delete(id);
    this.saveLocal();

  for (const r of body) {
    if (headerKey && r.join('\u0001').toLowerCase() === headerKey) continue; // repeated title row (next page / sheet)
    const s = wiz.map.map(ci => (ci >= 0 ? (r[ci] || '') : ''));
    const filledN = s.filter(Boolean).length;
    if (!filledN) continue;
    if (mapped >= 2 && filledN < 2) { half++; continue; }
    const key = s.map(norm).join('\u0001');
    if (seen.has(key)) { dupes++; continue; }
    seen.add(key); cards.push(s);
  }
  return { cards, half, dupes };
}

/* =========================================================
   Study logic (Anki-like learning steps)
   - Again: back after ~3 other cards, streak reset
   - Hard ("ken het, herhaal"): back after ~6 cards, streak reset
   - Good: streak +1; known only after 2× good in a row,
     with other cards in between (back after ~7 cards)
   - Known cards come back after 1, 3, 8, 20… days
   ========================================================= */
const GAP = { again: 3, hard: 6, good: 7 };

function startStudy(deckId, cram) {
  const d = getDeck(deckId); if (!d) return;
  const t = today();
  let ids;
  if (cram) ids = d.cards.map(c => c.id);
  else {
    const learn = [], rev = [], fresh = [];
    for (const c of d.cards) {
      if (c.st === 'learn') learn.push(c.id);
      else if (c.st === 'review') { if (c.due <= t) rev.push(c.id); }
      else fresh.push(c.id);
    }
    const lim = d.opt?.newLimit || 0;
    const newIds = d.opt?.shuffle ? shuffle(fresh).slice(0, lim || undefined) : fresh.slice(0, lim || undefined);
    ids = [...learn, ...rev, ...newIds];
  }
  if (d.opt?.shuffle) shuffle(ids);
  session = { deckId, queue: ids, total: ids.length, answered: 0, side: 0, start: 0, revealed: false, anim: false,
    st: { again: 0, hard: 0, good: 0, learned: 0 }, history: [], cram: !!cram };
  if (!ids.length) { view = { name: 'done', empty: true, deckId }; render(); return; }
  setStart();
  d.last = Date.now(); Store.touch(d);
  view = { name: 'study' }; render(); scrollTo(0, 0);
}
function setStart() {
  const d = getDeck(session.deckId);
  const s = d.opt?.start ?? 0;
  session.start = s === -1 ? Math.floor(Math.random() * d.n) : Math.min(s, d.n - 1);
  session.side = 0; session.revealed = false; session.commenting = false;
  Stats.add('s');
}
function currentCard() { const d = getDeck(session.deckId); return d && d.cards.find(c => c.id === session.queue[0]); }

function goodPreview(c) {
  if (c.st === 'review') { const iv = Math.max(c.iv + 1, Math.round(c.iv * 2.5)); return '+' + plural(iv, 'dag', 'dagen'); }
  if (c.k >= 1) return 'gekend ✓';
  return 'nog 1× juist';
}

function answer(grade) {
  if (!session || !session.revealed) return;
  const d = getDeck(session.deckId);
  const c = currentCard(); if (!c) return;
  session.history.push({ queue: session.queue.slice(), card: JSON.stringify(c), st: { ...session.st }, answered: session.answered });
  if (session.history.length > 30) session.history.shift();
  const cid = session.queue.shift();
  c.reps++;
  let gap = 0;
  if (c.st === 'review') {
    if (grade === 'good') { c.iv = Math.max(c.iv + 1, Math.round(c.iv * 2.5)); c.due = today() + c.iv; session.st.good++; }
    else if (grade === 'hard') { c.st = 'learn'; c.k = 1; gap = GAP.hard; session.st.hard++; }
    else { c.st = 'learn'; c.k = 0; c.iv = 0; c.lapses++; gap = GAP.again; session.st.again++; }
  } else {
    c.st = 'learn';
    if (grade === 'good') {
      c.k++; session.st.good++;
      if (c.k >= 2) { c.st = 'review'; c.k = 0; c.iv = c.iv > 0 ? Math.max(1, Math.round(c.iv * 1.2)) : 1; c.due = today() + c.iv; session.st.learned++; Stats.add('l'); }
      else gap = GAP.good;
    } else if (grade === 'hard') { c.k = 0; gap = GAP.hard; session.st.hard++; }
    else { c.k = 0; gap = GAP.again; session.st.again++; }
  }
  if (gap) session.queue.splice(Math.min(gap, session.queue.length), 0, cid);
  session.answered++;
  Stats.add('a');
  Store.touch(d);
  if (!session.queue.length) { view = { name: 'done', deckId: d.id }; render(); return; }
  setStart(); session.anim = true; render();
}
function undo() {
  if (!session || !session.history.length) return;
  const h = session.history.pop();
  const d = getDeck(session.deckId);
  const saved = JSON.parse(h.card);
  const c = d.cards.find(x => x.id === saved.id); if (c) Object.assign(c, saved);
  session.queue = h.queue; session.st = h.st; session.answered = h.answered;
  setStart(); session.revealed = true; session.side = 0;
  Store.touch(d); view = { name: 'study' }; render();
}
function flip() {
  if (!session) return;
  const d = getDeck(session.deckId);
  session.side = (session.side + 1) % d.n;
  session.revealed = true; session.anim = true;
  Stats.add('s');
  render();
}

function speak(text, lang) {
  try {
    const ss = window.speechSynthesis; if (!ss || !text) return;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (lang) {
      u.lang = lang;
      const vs = ss.getVoices();
      const v = vs.find(v => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase()) || vs.find(v => v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
      if (v) u.voice = v;
    }
    u.rate = 0.92; ss.speak(u);
  } catch (e) { /* speech not available */ }
}

/* =========================================================
   Export
   ========================================================= */
async function exportDeck(d, kind) {
  const rows = [d.names.slice(0, d.n), ...d.cards.map(c => c.s.slice(0, d.n))];
  const base = (d.name || 'flashcards').replace(/[\\/:*?"<>|]+/g, '').trim() || 'flashcards';
  let data, filename;
  if (kind === 'xlsx') {
    if (!window.XLSX) { toast('De Excel-module is niet geladen. Probeer CSV.'); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Kaarten');
    data = new Uint8Array(XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
    filename = base + '.xlsx';
  } else {
    const q = v => /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    data = '﻿' + rows.map(r => r.map(v => q(String(v || ''))).join(';')).join('\r\n');
    filename = base + '.csv';
  }
  await saveFile(filename, data, kind === 'xlsx' ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'text/csv;charset=utf-8');
}

async function saveFile(filename, data, mime) {
  let dl = null;
  try { if (window.claude && claude.use) dl = await claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: data instanceof Uint8Array ? new Blob([data]) : data }); toast('Bestand opgeslagen'); }
    catch (e) { if (e && e.code !== 'declined') toast('Downloaden lukte niet hier.'); }
    return;
  }
  const blob = new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- Back-up of everything (to move to another device) ---------- */
async function exportBackup() {
  const stamp = new Date().toISOString().slice(0, 10);
  const data = JSON.stringify({ app: 'luca-flashcards', version: 1, exported: Date.now(), folders, decks });
  await saveFile(`luca-flashcards-backup-${stamp}.json`, data, 'application/json');
}
async function importBackup(file) {
  try {
    const obj = JSON.parse(decodeText(await file.arrayBuffer()));
    if (!obj || obj.app !== 'luca-flashcards' || !Array.isArray(obj.decks)) throw new Error('bad');
    let added = 0, updated = 0;
    for (const f of obj.folders || []) if (f && f.id && !getFolder(f.id)) folders.push(f);
    Store.touchFolders();
    for (const d of obj.decks) {
      if (!d || !d.id || !Array.isArray(d.cards)) continue;
      Store.tombs.delete(d.id);
      const i = decks.findIndex(x => x.id === d.id);
      if (i < 0) { decks.push(d); added++; Store.touch(d); }
      else if ((d.updated || 0) > (decks[i].updated || 0)) { decks[i] = d; updated++; Store.touch(d); }
    }
    render();
    toast(added || updated ? `Back-up teruggezet: ${plural(added, 'nieuwe set', 'nieuwe sets')}${updated ? `, ${updated} bijgewerkt` : ''}` : 'Alles uit deze back-up stond er al');
  } catch (e) { toast('Dit is geen back-up van Uni Flashcards.'); }
}

            <span class="stack">${Array.from({ length: n }, (_, i) => `<span style="left:${i * 6}px;top:${(n - 1 - i) * 5}px"></span>`).join('')}</span>

      </div>
      <button class="btn primary block" data-act="wiz-next">Verder</button>`;
  } else if (w.step === 2) {
    const tab = (k, t) => `<button role="tab" aria-selected="${w.source === k}" data-act="wiz-src" data-src="${k}">${t}</button>`;
    let src = '';
    if (w.source === 'file') {
      src = `<label class="drop${w.loading ? ' busy' : ''}" id="drop" for="w-file">

          <strong>${w.loading ? 'Bestand lezen…' : 'Kies je bestand'}</strong>

        </label>`;
    } else if (w.source === 'paste') {
      src = `<div class="card-box">
          <label class="lbl" for="w-paste">Plak je lijst</label>
          <p class="help">Kopieer cellen uit Excel, Numbers of Google Sheets, of een lijstje zoals <i>el perro = dog</i> of <i>correr - to run</i>, en plak hieronder.</p>
          <textarea class="field" id="w-paste" data-wiz="paste" placeholder="el perro&#9;dog&#9;El perro duerme en el sofá.">${esc(w.paste)}</textarea>
          <button class="btn primary block" data-act="wiz-paste">Verder</button>
        </div>`;
    } else {
      src = `<div class="card-box">
          <p class="lbl">Kaarten zelf intypen</p>
          <p class="help" style="margin-top:0">${deck ? 'Je krijgt lege kaarten om in te vullen.' : `Je krijgt een lege set met ${w.n} kanten waarin je kaarten kunt typen.`}</p>
          <button class="btn primary block" data-act="wiz-manual">${deck ? 'Lege kaart toevoegen' : 'Lege set maken'}</button>
        </div>`;
    }
    body = `<p class="muted">${deck ? `Toevoegen aan <b>${esc(deck.name)}</b> (${deck.n} kanten).` : `Je set krijgt <b>${w.n} kanten</b>. Elke kolom wordt één kant.`}</p>
      <div class="tabs" role="tablist">${tab('file', 'Bestand')}${tab('paste', 'Plakken')}${tab('manual', 'Zelf typen')}</div>
      ${w.error ? `<p class="error" role="alert">${esc(w.error)}</p>` : ''}
      ${src}`;
  } else {
    const rows = curRows();
    const { cards, half, dupes } = wizardCards();
    const sheetNames = Object.keys(w.sheets).filter(k => k !== '__all__');
    const allLabel = /^Tabel /.test(sheetNames[0] || '') ? 'Alle tabellen samen' : 'Alle werkbladen samen';
    const colOpts = (sel) => `<option value="-1"${sel === -1 ? ' selected' : ''}>(leeg laten)</option>` +
      Array.from({ length: w.cols }, (_, ci) => {
        const sample = (w.header ? rows[0][ci] : (rows.find(r => r[ci]) || [])[ci]) || '';
        return `<option value="${ci}"${sel === ci ? ' selected' : ''}>Kolom ${colLetter(ci)}${sample ? ' – ' + esc(sample.slice(0, 22)) : ''}</option>`;
      }).join('');
    let warn = '';
    if (w.cols < w.n) {
      warn = `<div class="warn"><span>Je lijst heeft maar <b>${w.cols} ${w.cols === 1 ? 'kolom' : 'kolommen'}</b>, maar je koos ${w.n} kanten. ${w.n - w.cols === 1 ? 'Eén kant blijft' : 'Sommige kanten blijven'} leeg.</span>
        ${!w.append && w.cols >= 2 ? `<button class="btn sm" data-act="wiz-fit">Gebruik ${w.cols} kanten</button>` : ''}</div>`;
    } else if (w.cols > w.n) {
      warn = `<div class="warn"><span>Je lijst heeft <b>${w.cols} kolommen</b> en je koos ${w.n} kanten. Kies hieronder welke kolommen je gebruikt.</span>
        ${!w.append && w.cols <= 4 ? `<button class="btn sm" data-act="wiz-fit">Gebruik alle ${w.cols} kolommen</button>` : ''}</div>`;
    }
    const nt = w.notes || {};
    const fixes = [];
    if (nt.title) fixes.push(nt.title === 1 ? 'titel bovenaan overgeslagen' : `${nt.title} titelregels overgeslagen`);
    if (nt.numbering) fixes.push('nummering weggehaald');
    if (nt.split) fixes.push('woord en uitleg uit elkaar gehaald');
    if (half) fixes.push(`${plural(half, 'halve rij', 'halve rijen')} overgeslagen`);
    if (dupes) fixes.push(`${plural(dupes, 'dubbele kaart', 'dubbele kaarten')} overgeslagen`);
    const prev = cards.slice(0, 5);
    body = `<p class="found">Gevonden in <b>${esc(w.fileName)}</b>: ${plural(w.cols, 'kolom', 'kolommen')} en ${plural(rows.length, 'rij', 'rijen')}.</p>
      ${fixes.length ? `<p class="fixed">Automatisch opgeschoond: ${fixes.join(' · ')}.</p>` : ''}
      ${sheetNames.length > 1 ? `<div class="card-box"><label class="lbl" for="w-sheet">Welk deel van het bestand?</label><select class="field" id="w-sheet">
          <option value="__all__"${w.sheet === '__all__' ? ' selected' : ''}>${allLabel}</option>
          ${sheetNames.map(s => `<option value="${esc(s)}"${s === w.sheet ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></div>` : ''}
      ${warn}
      <div class="card-box">
        <label class="check"><input type="checkbox" id="w-header" ${w.header ? 'checked' : ''}> Eerste rij is een titelrij (wordt geen kaart)</label>
      </div>
      <div class="card-box">
        <p class="lbl">Welke kolom komt op welke kant?</p>
        <p class="help">Kant 1 zie je eerst. Staat de taal die je moet kennen in de verkeerde kolom? Verschuif de kanten met ↑ ↓ of wissel ze om.</p>
        ${w.map.map((ci, i) => `<div class="map-row">${sideHead(i, w.n, 'wiz-move')}
          <input class="field" data-wiz-name="${i}" value="${esc(w.names[i])}" aria-label="Naam van kant ${i + 1}" ${w.append ? 'disabled' : ''}>
          <select class="field" data-wiz-col="${i}" aria-label="Kolom voor kant ${i + 1}">${colOpts(ci)}</select></div>`).join('')}
        <button class="btn sm swap-btn" data-act="wiz-move" data-i="0" data-dir="1">⇅ Wissel kant 1 en 2</button>
      </div>
      <p class="lbl">Zo worden je kaarten</p>
      <div class="preview"><table><thead><tr>${w.names.map((n, i) => `<th>${i + 1}. ${esc(n)}</th>`).join('')}</tr></thead>
        <tbody>${prev.map(r => `<tr>${r.map(v => `<td>${esc(v) || '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${w.n}" class="muted">Geen kaarten gevonden. Kies andere kolommen of zet het vinkje voor de titelrij uit.</td></tr>`}</tbody></table></div>
      ${cards.length > 5 ? `<p class="muted small">…en nog ${cards.length - 5} meer.</p>` : ''}
      <div class="sticky-save"><button class="btn primary block" data-act="wiz-save" ${cards.length ? '' : 'disabled'}>${w.append ? `${plural(cards.length, 'kaart', 'kaarten')} toevoegen` : `Set opslaan · ${plural(cards.length, 'kaart', 'kaarten')}`}</button></div>`;
  }
  return `<header class="bar"><button class="icon-btn" data-act="${back}" aria-label="Terug">←</button><h1>${title}</h1>${stepTxt}</header>
    <section class="panel">${body}</section>`;
}

function textSize(t) { const n = t.length; return n <= 18 ? 's1' : n <= 45 ? 's2' : n <= 120 ? 's3' : 's4'; }

function renderStudy() {
  const d = getDeck(session.deckId); const c = currentCard();
  if (!d || !c) { view = { name: 'home', folder: homeFolder }; return renderHome(); }
  const sideIdx = (session.start + session.side) % d.n;
  const text = c.s[sideIdx] || '';
  const uniq = [...new Set(session.queue)].map(id => d.cards.find(x => x.id === id)).filter(Boolean);
  const cNew = uniq.filter(x => x.st === 'new').length, cLearn = uniq.filter(x => x.st === 'learn').length, cRev = uniq.filter(x => x.st === 'review').length;
  const pct = session.total ? Math.min(100, Math.round((session.total - uniq.length) / session.total * 100)) : 0;
  const chip = c.st === 'new' ? `<span class="chip new">Nieuw</span>`
    : c.st === 'learn' ? `<span class="chip learn">Leren <i class="pip ${c.k >= 1 ? 'on' : ''}"></i><i class="pip"></i></span>`
    : `<span class="chip review">Herhaling</span>`;
  const lang = d.langs[sideIdx];
  const canSpeak = !!(lang && text && window.speechSynthesis);
  const answers = session.revealed
    ? `<div class="answers">
        <button class="ans again" data-act="ans" data-g="again"><span class="lbl-t">Nog niet</span><small>komt snel terug</small></button>
        <button class="ans hard" data-act="ans" data-g="hard"><span class="lbl-t">Ken het, herhaal</span><small>komt later terug</small></button>
        <button class="ans good" data-act="ans" data-g="good"><span class="lbl-t">Ik ken het</span><small>${esc(goodPreview(c))}</small></button>
      </div>`
    : `<div class="answers single"><button class="btn primary flip-btn" data-act="flip">Draai om</button></div>`;
  const anim = session.anim; session.anim = false;
  return `<div class="study">
    <header class="bar">
      <button class="icon-btn" data-act="study-exit" aria-label="Stoppen">✕</button>
      <div class="title"><b>${esc(d.name)}</b>
        <span class="counts"><span class="c-new">${cNew} nieuw</span><span class="c-learn">${cLearn} leren</span><span class="c-rev">${cRev} herhalen</span></span></div>
      ${d.ro && Cloud.user ? `<button class="icon-btn" data-act="card-comment" aria-label="Opmerking of voorstel over deze kaart" title="Opmerking over deze kaart">${ICON.chat}</button>` : ''}
      <button class="icon-btn" data-act="undo" aria-label="Vorige antwoord ongedaan maken" title="Ongedaan maken" ${session.history.length ? '' : 'disabled'}>↶</button>
    </header>
    ${session.commenting ? `<form class="card-box card-comment" data-form="card-comment">
      <p class="lbl">Opmerking over “${esc(c.s[0] || '')}”</p>
      <p class="help" style="margin-top:0">Alleen @${esc(d.ownerName || '')} (de eigenaar) ziet dit.</p>
      <textarea class="field small-ta" id="cc-body" maxlength="2000" placeholder="bv. De vertaling klopt niet, het moet … zijn" required></textarea>
      <label class="check"><input type="checkbox" id="cc-sugg" checked> Dit is een voorgestelde aanpassing</label>
      <div class="btn-row"><button class="btn primary sm" type="submit">Versturen</button><button class="btn sm" type="button" data-act="card-comment">Annuleren</button></div>
    </form>` : ''}
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    <div class="stage"><div class="card-wrap">
      <button class="flash${anim ? ' anim' : ''}" data-act="flip" aria-label="Kaart: ${esc(d.names[sideIdx])}. Tik om om te draaien.">
        <div class="flash-top"><span class="side-label">${esc(d.names[sideIdx])}</span>${chip}</div>
        <div class="flash-body"><p class="flash-text ${text ? textSize(text) : 'blank'}">${text ? esc(text) : '(deze kant is leeg)'}</p></div>
        <div class="flash-foot">
          <span class="side-dots" aria-hidden="true">${Array.from({ length: d.n }, (_, i) => `<span class="${i === session.side ? 'on' : ''}"></span>`).join('')}</span>
          <span class="tap-hint">${session.revealed ? 'tik voor de volgende kant' : 'tik om om te draaien'}</span>
        </div>
      </button>
      ${canSpeak ? `<button class="speak" data-act="speak" aria-label="Lees voor">🔊</button>` : ''}
    </div></div>
    ${answers}
  </div>`;
}

function renderDone() {
  const d = getDeck(view.deckId); if (!d) { view = { name: 'home', folder: homeFolder }; return renderHome(); }
  const s = deckStats(d);
  if (view.empty) {
    return `<section class="done">
      <h1>Niets meer te oefenen vandaag</h1>
      <p class="muted">Alle kaarten van <b>${esc(d.name)}</b> zijn bij. ${s.tomorrow ? `Morgen komen er ${s.tomorrow} terug.` : ''}</p>
      <div class="btns"><button class="btn primary" data-act="cram" data-id="${d.id}">Toch alles oefenen</button><button class="btn" data-act="home">Terug naar mijn sets</button></div>
    </section>`;
  }
  const st = session ? session.st : { again: 0, hard: 0, good: 0, learned: 0 };
  return `<section class="done">
    <h1>Ronde klaar!</h1>
    <p class="muted">${esc(d.name)}</p>
    <div class="stats">
      <div class="stat"><b>${session ? session.answered : 0}</b><span>antwoorden</span></div>
      <div class="stat"><b style="color:var(--good)">${st.learned}</b><span>nu gekend</span></div>
      <div class="stat"><b style="color:var(--again)">${st.again}</b><span>nog niet</span></div>
    </div>
    <p>${s.tomorrow ? `Morgen komen <b>${s.tomorrow}</b> kaarten terug om te herhalen.` : 'Kom morgen terug om te herhalen.'}</p>
    <div class="btns"><button class="btn primary" data-act="home">Terug naar mijn sets</button><button class="btn" data-act="cram" data-id="${d.id}">Alles nog eens oefenen</button></div>
  </section>`;
}

function render() {
  const v = view.name;
  const views = {
    new: renderWizard, edit: renderEdit, study: renderStudy, done: renderDone,
    auth: renderAuth, profile: renderProfile, friends: renderFriends, notifs: renderNotifs,
    chats: renderChats, chat: renderChat, item: renderItem, link: renderLink
  };
  app.innerHTML = (views[v] || renderHome)();
}

/* =========================================================
   Events
   ========================================================= */
function swapAt(a, i, j) { const t = a[i]; a[i] = a[j]; a[j] = t; }
function moveDeckSide(d, i, dir) {
  const j = i + dir; if (j < 0 || j >= d.n) return;
  while (d.langs.length < d.n) d.langs.push('');
  swapAt(d.names, i, j); swapAt(d.langs, i, j);
  d.cards.forEach(c => { while (c.s.length < d.n) c.s.push(''); swapAt(c.s, i, j); });
  if (d.opt && d.opt.start === i) d.opt.start = j; else if (d.opt && d.opt.start === j) d.opt.start = i;
}
function createFolder(name, color) {
  const f = { id: uid(), name: name.slice(0, 40), c: color ?? folders.length % FOLDER_COLORS, created: Date.now(), u: Date.now(), vis: 'private' };
  folders.push(f); Store.touchFolders(); return f;
}
function goHome() { session = null; view = { name: 'home', folder: homeFolder }; render(); scrollTo(0, 0); }

const ACT = {
  home() { goHome(); },
  new() { const fo = view.name === 'home' && view.folder && getFolder(view.folder); startWizard(null, fo && !fo.ro ? fo.id : ''); },
  sample() {
    const rows = [
      ['el perro', 'dog', 'El perro duerme en el sofá.'], ['la manzana', 'apple', 'Me como una manzana cada mañana.'],
      ['correr', 'to run', 'Me gusta correr en el parque.'], ['la biblioteca', 'library', 'Estudio en la biblioteca los lunes.'],
      ['cansado', 'tired', 'Estoy muy cansado después del partido.'], ['el mercado', 'market', 'Compramos fruta en el mercado.'],
      ['aprender', 'to learn', 'Quiero aprender español este año.'], ['la playa', 'beach', 'En verano vamos a la playa.']
    ];
    const d = makeDeck('Voorbeeld – Spaans', 3, ['Spaans', 'Engels', 'Zin'], rows);
    decks.push(d); Store.touch(d); render();
  },
  'open-folder'(el) { homeFolder = el.dataset.id; view = { name: 'home', folder: homeFolder }; render(); scrollTo(0, 0); },
  'folder-back'() { homeFolder = null; view = { name: 'home' }; render(); scrollTo(0, 0); },
  'folder-new'() { view.newFolder = true; render(); const i = document.getElementById('f-name'); if (i) i.focus(); },
  'folder-cancel'() { view.newFolder = false; view.newFolderName = ''; view.newColor = null; render(); },
  'folder-color'(el) {
    const c = +el.dataset.c;
    if (view.newFolder) {
      const inp = document.getElementById('f-name'); if (inp) view.newFolderName = inp.value;
      view.newColor = c; render(); const i = document.getElementById('f-name'); if (i) i.focus(); return;
    }
    const f = getFolder(view.name === 'item' ? view.id : view.folder); if (!f) return;
    f.c = c;
    if (f.ro) { Cloud.saveShared(); if (Cloud.user) Cloud.sb.rpc('set_member_color', { p_owner: f.owner, p_kind: 'folder', p_item: f.srcId, p_color: c }); render(); return; }
    f.u = Date.now(); Store.touchFolders(); render();
  },
  'folder-rename'() { view.rename = true; view.confirm = null; render(); const i = document.getElementById('f-rename'); if (i) { i.focus(); i.select(); } },
  'folder-delete'() { view.confirm = 'folder'; view.rename = false; render(); },
  'folder-manage-cancel'() { view.confirm = null; view.rename = false; render(); },

// Folder pickers: "+ Nieuwe map…" asks for a name inline
function pickFolder(select, apply) {
  if (select.value !== '__new__') { apply(select.value); return; }
  const box = document.createElement('div'); box.className = 'inline-new';
  box.innerHTML = `<input class="field" id="inline-folder" placeholder="Naam van de nieuwe map" maxlength="40"><button class="btn primary sm" type="button" id="inline-folder-ok">Maak</button>`;
  select.hidden = true; select.after(box);
  const inp = box.querySelector('input'); inp.focus();
  const done = () => { const name = inp.value.trim(); if (name) { const f = createFolder(name); apply(f.id); } render(); };
  box.querySelector('button').addEventListener('click', done);
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); done(); } else if (ev.key === 'Escape') render(); });
}

    try {

        delete this.pending[day]; lsSet(LS_STATS, this.pending);
        if (!p || (!p.a && !p.s && !p.l)) continue;
        const { error } = await Cloud.sb.rpc('add_study', { p_day: day, p_answers: p.a, p_sides: p.s, p_learned: p.l });

  }
};

    pushF.forEach(id => { const f = getFolder(id); if (f) this.written.set('f:' + id, this.folderSig(f)); this.queueFolder(id); });
    pushD.forEach(id => this.queueDeck(id));
    delF.forEach(id => this.queueDeleteFolder(id));
    delD.forEach(id => this.queueDeleteDeck(id));
  },

  run(fn) {
    this.chain = this.chain.then(fn).then(() => {
      if (Store.errorShown) { Store.errorShown = false; updateSyncChip(); }
    }).catch(e => {
      console.warn('Uni Flashcards sync', e);
      if (!Store.errorShown) { Store.errorShown = true; updateSyncChip(); }
    });
    return this.chain;
  },
  scheduleDeck(id) {
    clearTimeout(this.timers.get(id));
    this.timers.set(id, setTimeout(() => { this.timers.delete(id); this.queueDeck(id); }, 1200));
  },
  queueDeck(id) {
    return this.run(async () => {
      const d = getDeck(id); if (!d || d.ro || !this.user) return;
      const { error } = await this.sb.from('decks').upsert({
        owner: this.user.id, id: d.id, folder_id: d.folder || null, name: String(d.name || '').slice(0, 200),
        visibility: d.vis || 'private', card_count: d.cards.length, data: d, deleted: false, updated_at: d.updated || Date.now()
      });
      if (error) throw error;
    });
  },
  queueDeleteDeck(id) {
    return this.run(async () => {
      if (!this.user) return;
      const { error } = await this.sb.from('decks').upsert({ owner: this.user.id, id, deleted: true, data: {}, card_count: 0, updated_at: Date.now() });
      if (error) throw error;
    });
  },
  folderSig: f => JSON.stringify([f.name, f.c, f.vis || 'private']),
  scheduleFolders() {
    clearTimeout(this.folderTimer);
    this.folderTimer = setTimeout(() => { this.folderTimer = null; this.pushFolders(); }, 700);
  },
  pushFolders() {
    for (const f of folders) {
      if (f.ro) continue;
      const sig = this.folderSig(f);
      if (this.written.get('f:' + f.id) !== sig) { this.written.set('f:' + f.id, sig); this.queueFolder(f.id); }
    }
    for (const t of Store.tombs) {
      if (t.startsWith('f:') && !this.written.has('del:' + t)) { this.written.set('del:' + t, '1'); this.queueDeleteFolder(t.slice(2)); }
    }
  },
  queueFolder(id) {
    return this.run(async () => {
      const f = getFolder(id); if (!f || f.ro || !this.user) return;
      const { error } = await this.sb.from('folders').upsert({
        owner: this.user.id, id: f.id, name: String(f.name || '').slice(0, 60), color: f.c || 0,
        visibility: f.vis || 'private', deleted: false, updated_at: f.u || Date.now()
      });
      if (error) throw error;
    });
  },
  queueDeleteFolder(id) {
    return this.run(async () => {
      if (!this.user) return;
      const { error } = await this.sb.from('folders').upsert({ owner: this.user.id, id, deleted: true, updated_at: Date.now() });
      if (error) throw error;
    });
  },
  scheduleProgress(d) {
    clearTimeout(this.progTimers.get(d.id));
    this.progTimers.set(d.id, setTimeout(() => { this.progTimers.delete(d.id); this.queueProgress(d.id); }, 1500));
  },
  queueProgress(id) {
    return this.run(async () => {
      const d = getDeck(id); if (!d || !d.ro || !this.user) return;
      const progress = {};
      d.cards.forEach(c => { if (c.st !== 'new' || c.reps) progress[c.id] = encP(c); });
      const { error } = await this.sb.from('deck_progress').upsert({ user_id: this.user.id, owner: d.owner, deck_id: d.srcId, progress, updated_at: Date.now() });
      if (error) throw error;
    });
  },
  flush() {
    for (const [id, t] of this.timers) { clearTimeout(t); this.queueDeck(id); }
    this.timers.clear();
    for (const [id, t] of this.progTimers) { clearTimeout(t); this.queueProgress(id); }
    this.progTimers.clear();
    if (this.folderTimer) { clearTimeout(this.folderTimer); this.folderTimer = null; this.pushFolders(); }
  },
  async settle() { this.flush(); await this.chain; },

  /* ---- shared with you (you are a member) ---- */
  clearShared() { decks = decks.filter(d => !d.ro); folders = folders.filter(f => !f.ro); lsSet(LS_SHARED, null); },
  saveShared() { lsSet(LS_SHARED, { decks: decks.filter(d => d.ro), folders: folders.filter(f => f.ro) }); },
  loadSharedLocal() {
    const s = lsGet(LS_SHARED, null);
    if (s && Array.isArray(s.decks)) { decks.push(...s.decks.filter(d => d && Array.isArray(d.cards))); folders.push(...(s.folders || [])); }
  },
  memberCount(owner, kind, item) { return (this.members[owner + '|' + kind + '|' + item] || []).length + 1; },

  async loadShared() {
    if (!this.user) return;
    await this.settle();
    const uid = this.user.id;
    const [all, pr] = await Promise.all([
      this.sb.from('memberships').select('owner,kind,item_id,member,color'),
      this.sb.from('deck_progress').select('owner,deck_id,progress')
    ]);
    if (all.error) throw all.error;
    this.members = {};
    (all.data || []).forEach(r => { const k = r.owner + '|' + r.kind + '|' + r.item_id; (this.members[k] ||= []).push(r.member); });
    const mine = (all.data || []).filter(r => r.member === uid);
    const prog = {}; (pr.data || []).forEach(r => { prog[r.owner + '|' + r.deck_id] = r.progress || {}; });
    const names = await this.names(mine.map(m => m.owner));
    const old = new Map(decks.filter(d => d.ro).map(d => [d.id, d]));
    const newF = [], newD = [];
    const mkDeck = (owner, row, folderSid) => {
      const data = row.data || {};
      const sid = sharedId(owner, row.id);
      const p = prog[owner + '|' + row.id] || {};
      const prev = old.get(sid);
      const prevCards = prev ? new Map(prev.cards.map(c => [c.id, c])) : new Map();
      const cards = (data.cards || []).map(c => {
        const q = decP(p[c.id]) || (prevCards.has(c.id) ? prevCards.get(c.id) : null);
        return { id: c.id, s: c.s || [], st: q ? q.st : 'new', k: q ? q.k : 0, iv: q ? q.iv : 0, due: q ? q.due : 0, reps: q ? q.reps : 0, lapses: q ? q.lapses : 0 };
      });
      return {
        id: sid, srcId: row.id, ro: true, owner, ownerName: names[owner], name: data.name || row.name || 'Set',
        n: data.n || 2, names: data.names || DEFAULT_NAMES.slice(0, data.n || 2), langs: data.langs || [],
        opt: prev ? prev.opt : (data.opt || { newLimit: 30, start: 0, shuffle: true }),
        folder: folderSid || '', cards, created: data.created || Date.now(), updated: row.updated_at || 0,
        last: prev ? prev.last : 0, vis: row.visibility, members: this.memberCount(owner, 'deck', row.id)
      };
    };
    for (const m of mine.filter(m => m.kind === 'folder')) {
      const { data: f } = await this.sb.from('folders').select('id,name,color,visibility,deleted').eq('owner', m.owner).eq('id', m.item_id).maybeSingle();
      if (!f || f.deleted) continue;
      const fsid = sharedId(m.owner, f.id);
      newF.push({ id: fsid, srcId: f.id, ro: true, owner: m.owner, ownerName: names[m.owner], name: f.name, c: m.color ?? f.color, vis: f.visibility, members: this.memberCount(m.owner, 'folder', f.id), created: 0 });
      const { data: ds } = await this.sb.from('decks').select('id,name,data,updated_at,visibility').eq('owner', m.owner).eq('folder_id', f.id).eq('deleted', false);
      (ds || []).forEach(r => newD.push(mkDeck(m.owner, r, fsid)));
    }
    for (const m of mine.filter(m => m.kind === 'deck')) {
      if (newD.some(d => d.id === sharedId(m.owner, m.item_id))) continue;
      const { data: r } = await this.sb.from('decks').select('id,name,data,updated_at,visibility,deleted').eq('owner', m.owner).eq('id', m.item_id).maybeSingle();
      if (!r || r.deleted) continue;
      newD.push(mkDeck(m.owner, r, ''));
    }
    decks = [...decks.filter(d => !d.ro), ...newD];
    folders = [...folders.filter(f => !f.ro), ...newF];
    this.saveShared();
  },

  /* ---- friends, counters, live updates ---- */
  async refreshSocial() {
    if (!this.user) return;
    const uid = this.user.id;
    const { data: fs } = await this.sb.from('friendships').select('id,requester,addressee,status');
    const others = (fs || []).map(f => f.requester === uid ? f.addressee : f.requester);
    const names = await this.names(others);
    this.friends = []; this.incoming = []; this.outgoing = [];
    for (const f of fs || []) {
      const other = f.requester === uid ? f.addressee : f.requester;
      const p = { id: other, username: names[other], fid: f.id };
      if (f.status === 'accepted') this.friends.push(p);
      else if (f.addressee === uid) this.incoming.push(p);
      else this.outgoing.push(p);
    }
    this.friends.sort((a, b) => a.username.localeCompare(b.username));
    await this.refreshCounts();
  },
  async refreshCounts() {
    if (!this.user) return;
    const uid = this.user.id;
    const [n, m] = await Promise.all([
      this.sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', uid).is('read_at', null),
      this.sb.from('messages').select('id', { count: 'exact', head: true }).eq('to_user', uid).is('read_at', null)
    ]);
    this.unreadNotif = n.count || 0; this.unreadChat = m.count || 0;
    updateBadges();
  },
  relation(uid) {
    if (!this.user) return 'none';
    if (uid === this.user.id) return 'me';
    if (this.friends.some(f => f.id === uid)) return 'friend';
    if (this.incoming.some(f => f.id === uid)) return 'incoming';
    if (this.outgoing.some(f => f.id === uid)) return 'outgoing';
    return 'none';
  },
  subscribe() {
    try {
      if (this.channel) this.sb.removeChannel(this.channel);
      const uid = this.user.id;
      this.channel = this.sb.channel('me-' + uid)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'to_user=eq.' + uid }, p => this.onMessage(p.new))
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + uid }, p => this.onNotification(p.new))
        .subscribe();
    } catch (e) { /* polling still works */ }
  },
  onMessage(msg) {
    if (view.name === 'chat' && view.uid === msg.from_user) { Chat.receive(msg); this.sb.rpc('mark_chat_read', { p_other: msg.from_user }); }
    else { this.unreadChat++; updateBadges(); if (view.name === 'chats') Chat.loadList(); }
  },
  async onNotification(n) {
    this.unreadNotif++; updateBadges();
    const who = (await this.names([n.actor]))[n.actor];
    toast(notifText(n, who).replace(/<[^>]+>/g, ''));
    if (n.type === 'friend_request' || n.type === 'friend_accepted') await this.refreshSocial();
    if (n.type === 'invite_accepted' || n.type === 'member_joined') await this.loadShared();
    if (view.name === 'notifs') Notifs.load(); else softRender();
  },
  startPolling() {
    clearInterval(this.poll);
    this.poll = setInterval(() => { if (document.visibilityState === 'visible' && this.user) this.refreshCounts().catch(() => {}); }, 45000);
  },

  /* ---- account ---- */
  async signUp(email, password, username) {
    const u = String(username || '').trim().toLowerCase();
    if (!/^[a-z0-9_.]{3,20}$/.test(u)) return 'Je gebruikersnaam moet 3 tot 20 tekens hebben: kleine letters, cijfers, _ of .';
    const { data: ok } = await this.sb.rpc('username_available', { u });
    if (!ok) return 'Deze gebruikersnaam is al bezet. Kies een andere.';
    const { data, error } = await this.sb.auth.signUp({ email: String(email).trim(), password, options: { data: { username: u } } });
    if (error) return authError(error);
    if (!data.session) return 'Je account is gemaakt. Bevestig eerst je e-mailadres via de mail die je kreeg, en log daarna in.';
    await this.start(data.user);
    return null;
  },
  async signIn(email, password) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email: String(email).trim(), password });
    if (error) return authError(error);
    await this.start(data.user);
    return null;
  },
  async signOut() {
    try { await this.settle(); await Stats.flush(); } catch (e) { /* ignore */ }
    try { if (this.channel) this.sb.removeChannel(this.channel); } catch (e) { /* ignore */ }
    clearInterval(this.poll);
    await this.sb.auth.signOut();
    this.user = null; this.me = null; this.friends = []; this.incoming = []; this.outgoing = []; this.members = {};
    this.unreadNotif = 0; this.unreadChat = 0; this.written.clear();
    decks = []; folders = []; foldersUpdated = 0; Store.tombs = new Set(); Store.mode = 'local';
    lsSet(LS_OWNER, null); this.clearShared(); Store.saveLocal();
  }
};

function authError(e) {
  const m = String((e && e.message) || '');
  if (/invalid login/i.test(m)) return 'E-mailadres of wachtwoord klopt niet.';
  if (/already registered|already exists/i.test(m)) return 'Er bestaat al een account met dit e-mailadres. Log in.';
  if (/at least 6|password should/i.test(m)) return 'Je wachtwoord moet minstens 6 tekens hebben.';
  if (/rate limit|too many/i.test(m)) return 'Te veel pogingen na elkaar. Wacht een paar minuten en probeer opnieuw.';
  if (/database error saving new user/i.test(m)) return 'Deze gebruikersnaam is al bezet of ongeldig. Kies een andere.';
  if (/invalid.*email|email.*invalid/i.test(m)) return 'Dit e-mailadres is niet geldig.';
  if (/fetch|network/i.test(m)) return 'Geen verbinding. Controleer je internet.';
  return 'Er ging iets mis: ' + m;
}

async function openProfile(uid) {
  view = { name: 'profile', uid, loading: true }; render(); scrollTo(0, 0);

  const [p, st] = await Promise.all([
    Cloud.sb.from('profiles').select('id,username,display_name,created_at').eq('id', uid).maybeSingle(),
    Cloud.sb.rpc('get_stats', { p_user: uid, p_today: dayStr() })
  ]);
  let fl = [], dl = [];
  if (uid !== Cloud.user.id) {
    const [a, b] = await Promise.all([
      Cloud.sb.from('folders').select('id,name,color,visibility').eq('owner', uid).eq('deleted', false),
      Cloud.sb.from('decks').select('id,name,card_count,folder_id,visibility').eq('owner', uid).eq('deleted', false)
    ]);
    fl = a.data || []; dl = b.data || [];

      ...dl.filter(d => !d.folder_id || !fl.some(f => f.id === d.folder_id)).map(d => row('deck', d, plural(d.card_count, 'kaart', 'kaarten')))
    ];

  }
  return backBar(rel === 'me' ? 'Mijn profiel' : 'Profiel') + `<section class="panel">
    <div class="profile-head">${avatar(p.username, true)}<div><h2>@${esc(p.username)}</h2><p class="muted small">${since ? 'Lid sinds ' + since : ''}${s.active_days ? ` · ${plural(s.active_days, 'dag', 'dagen')} gestudeerd` : ''}</p></div></div>
    ${actions}
    ${statTiles(s)}
    ${rel === 'me' ? '<p class="muted small center">Iedereen met een account kan deze statistieken zien.</p>' : ''}

}

async function shareText(title, text, url) {

}

const Notifs = {

/* ---------- Chat ---------- */
const Chat = {
  async openList() { view = { name: 'chats', loading: true }; render(); scrollTo(0, 0); await this.loadList(); },
  async loadList() {
    const v = view;
    const uid = Cloud.user.id;
    const { data } = await Cloud.sb.from('messages').select('id,from_user,to_user,kind,body,created_at,read_at').order('created_at', { ascending: false }).limit(300);
    const by = new Map();
    for (const m of data || []) {
      const other = m.from_user === uid ? m.to_user : m.from_user;
      const e = by.get(other) || { id: other, last: m, unread: 0 };
      if (m.to_user === uid && !m.read_at) e.unread++;
      by.set(other, e);
    }
    Cloud.friends.forEach(f => { if (!by.has(f.id)) by.set(f.id, { id: f.id, last: null, unread: 0 }); });
    await Cloud.names([...by.keys()]);
    if (view !== v && view.name !== 'chats') return;
    view.loading = false; view.data = [...by.values()];
    render();
  },
  async open(uid) {
    view = { name: 'chat', uid, loading: true, draft: '' }; render();
    const v = view, me = Cloud.user.id;
    const [r] = await Promise.all([
      Cloud.sb.from('messages').select('id,from_user,to_user,kind,body,invite_id,created_at,read_at')
        .or(`and(from_user.eq.${me},to_user.eq.${uid}),and(from_user.eq.${uid},to_user.eq.${me})`)
        .order('created_at', { ascending: true }).limit(300),
      Cloud.names([uid])
    ]);
    const msgs = r.data || [];
    const inv = await this.invites(msgs);
    if (view !== v) return;
    view.loading = false; view.data = { msgs, inv };
    render(); this.scrollEnd();
    if (msgs.some(m => m.to_user === me && !m.read_at)) { await Cloud.sb.rpc('mark_chat_read', { p_other: uid }); Cloud.refreshCounts(); }
  },
  async invites(msgs) {
    const ids = msgs.filter(m => m.invite_id).map(m => m.invite_id);
    const inv = {};
    if (ids.length) { const r = await Cloud.sb.from('invites').select('id,status,kind,item_name,color,from_user,to_user').in('id', ids); (r.data || []).forEach(i => { inv[i.id] = i; }); }
    return inv;
  },
  bubble(m, inv) {
    const mine = m.from_user === Cloud.user.id;
    const who = Cloud.nameCache[m.from_user] || '';
    const time = `<span class="time">${new Date(m.created_at).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' })}</span>`;
    if (m.kind === 'invite') {
      const i = inv[m.invite_id] || {};
      const what = i.kind === 'deck' ? 'set' : 'map';
      const act = !mine && i.status === 'pending'
        ? `<div class="btn-row"><button class="btn primary sm" data-act="invite-respond" data-iid="${m.invite_id}" data-yes="1">Accepteren</button><button class="btn sm" data-act="invite-respond" data-iid="${m.invite_id}" data-yes="0">Weigeren</button></div>`
        : `<span class="pill${i.status === 'accepted' ? ' ok' : ''}">${i.status === 'accepted' ? 'Geaccepteerd ✓' : i.status === 'declined' ? 'Geweigerd' : 'Wacht op antwoord'}</span>`;
      return `<div class="msg ${mine ? 'mine' : ''}"><div class="invite-card"><span class="fdot ${i.kind === 'deck' ? 'set' : 'c' + ((i.color || 0) % FOLDER_COLORS)}"></span>
        <div><p class="small muted">${mine ? 'Je deelde een ' + what : '@' + esc(who) + ' deelt een ' + what + ' met je'}</p><b>${esc(i.item_name || m.body)}</b>
        <p class="small muted">${mine ? '' : 'Je wordt lid: alleen @' + esc(who) + ' kan hem bewerken.'}</p>${act}</div></div>${time}</div>`;
    }
    if (m.kind === 'reminder') {
      return `<div class="msg ${mine ? 'mine' : ''}"><div class="bubble reminder">⏰ ${mine ? 'Je stuurde een herinnering om te studeren' : '@' + esc(who) + ' herinnert je eraan om vandaag te studeren!'}</div>${time}</div>`;
    }
    return `<div class="msg ${mine ? 'mine' : ''}"><div class="bubble">${esc(m.body)}</div>${time}</div>`;
  },
  receive(m) {
    if (!view.data) return;
    view.data.msgs.push(m);
    const finish = async () => {
      if (m.invite_id) Object.assign(view.data.inv, await this.invites([m]));
      const box = document.getElementById('chat-msgs');
      if (box) { box.insertAdjacentHTML('beforeend', this.bubble(m, view.data.inv)); this.scrollEnd(); }
    };
    finish();
  },
  scrollEnd() { const b = document.getElementById('chat-msgs'); if (b) b.scrollTop = b.scrollHeight; },
  async send() {
    const input = document.getElementById('chat-input');
    const body = (input && input.value || '').trim(); if (!body) return;
    input.value = ''; view.draft = '';
    const { data, error } = await Cloud.sb.from('messages').insert({ from_user: Cloud.user.id, to_user: view.uid, body }).select().single();
    if (error) { toast(Cloud.relation(view.uid) === 'friend' ? 'Versturen lukte niet. Probeer opnieuw.' : 'Je kunt alleen chatten met vrienden.'); input.value = body; return; }
    this.receive(data);
  }
};

      ${decks.filter(d => !d.ro).map(d => `<button class="pick-row" data-act="invite" data-kind="deck" data-id="${d.id}" data-uid="${uid}"><span class="fdot set"></span>${esc(d.name)}<span class="muted small">${plural(d.cards.length, 'kaart', 'kaarten')}</span></button>`).join('') || ''}
      <button class="btn ghost sm" data-act="share-pick">Sluiten</button></div>` : '';
  return head + `<div class="chat">

      : '<p class="muted small center">Jullie zijn (nog) geen vrienden, dus je kunt geen berichten sturen.</p>'}
  </div>`;

/* ---------- Sharing settings per folder / set ---------- */
function itemOf(kind, id) { return kind === 'folder' ? getFolder(id) : getDeck(id); }
function openItem(kind, id) {
  const obj = itemOf(kind, id);
  if (!obj) { toast('Deze map of set staat niet (meer) in je app.'); return; }
  view = { name: 'item', kind, id }; render(); scrollTo(0, 0);
  if (Cloud.user) loadItem();
}
async function loadItem() {
  const v = view; const obj = itemOf(v.kind, v.id); if (!obj || !Cloud.user) return;
  const owner = obj.ro ? obj.owner : Cloud.user.id, src = obj.ro ? obj.srcId : obj.id;
  const ids = [src];
  if (v.kind === 'folder') decks.filter(d => d.folder === obj.id).forEach(d => ids.push(d.ro ? d.srcId : d.id));
  const [ms, cm] = await Promise.all([
    Cloud.sb.from('memberships').select('member,joined_at').eq('owner', owner).eq('kind', v.kind).eq('item_id', src),
    Cloud.sb.from('comments').select('id,author,body,is_suggestion,status,card_id,item_id,kind,created_at').eq('owner', owner).in('item_id', ids).order('created_at', { ascending: false }).limit(100)
  ]);
  const members = (ms.data || []).map(m => m.member);
  await Cloud.names([owner, ...members, ...(cm.data || []).map(c => c.author)]);
  if (view !== v) return;
  view.data = { ...(view.data || {}), owner, src, members, comments: cm.data || [] };
  Cloud.members[owner + '|' + v.kind + '|' + src] = members;
  render();
}
function payloadOf(kind, obj) {
  const deckP = d => ({ name: d.name, n: d.n, names: d.names.slice(0, d.n), langs: (d.langs || []).slice(0, d.n), opt: d.opt, cards: d.cards.map(c => c.s.slice(0, d.n)) });
  if (kind === 'folder') return { type: 'folder', name: obj.name, c: obj.c || 0, decks: decks.filter(d => d.folder === obj.id).map(deckP) };
  return { type: 'deck', deck: deckP(obj) };
}
