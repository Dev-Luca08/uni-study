<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Uni Study: studieplanner en flashcards in één. Made by Luca Cicarelli.">
<meta name="theme-color" content="#1F3FB5">
<script>
// Old links (shared sets, friend invites, password e-mails) pointed here: pass them on to Flashcards
if (location.hash.length > 1) location.replace('flashcards.html' + location.hash);
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uni Study">
<title>Uni Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="planner.css">
<style>
#app { padding-bottom: 32px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 560px; }
.hero { text-align: center; padding: 28px 0 22px; display: grid; gap: 8px; justify-items: center; }
.hero .logo { width: 72px; height: 72px; border-radius: 22px; font-size: 2.3rem; }
.hero h1 { font-size: clamp(2.2rem, 10vw, 3rem); }
.choices { display: grid; gap: 14px; }
.choice { display: flex; align-items: center; gap: 16px; padding: 20px 18px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r) + 4px); box-shadow: var(--shadow); transition: transform .12s; }
.choice:hover { transform: translateY(-2px); border-color: var(--accent); }
.choice .em { color: var(--accent); width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 2rem; background: var(--accent-soft); flex: none; }
.choice b { font-family: var(--font-display); font-size: 1.45rem; display: block; line-height: 1.2; }
.choice span.d { color: var(--muted); font-size: .93rem; }
.choice .go { margin-left: auto; font-size: 1.4rem; color: var(--accent); }
</style>
<script src="theme.js"></script>
<script src="icons.js"></script>
</head>
<body>
<div id="app">
  <header class="hero"><span class="logo" aria-hidden="true" data-ic="logo"></span><h1>Uni Study</h1><p class="muted">Wat wil je doen?</p></header>
  <nav class="choices" aria-label="Kies onderdeel">
    <a class="choice" href="planner.html"><span class="em" aria-hidden="true" data-ic="plan"></span><span><b>Planning</b><span class="d">Vakken, hoofdstukken, wat je vandaag moet doen, timers en statistieken</span></span><span class="go" aria-hidden="true">›</span></a>
    <a class="choice" href="flashcards.html"><span class="em" aria-hidden="true" data-ic="cards"></span><span><b>Flashcards</b><span class="d">Je sets oefenen met slim herhalen, vrienden en delen</span></span><span class="go" aria-hidden="true">›</span></a>
  </nav>
  <div id="install" style="margin-top:18px"></div>
  <footer class="footer">Made by <b>Luca Cicarelli</b></footer>
</div>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
// Install Uni Study as an app (only shown in the browser, not inside the installed app)
(function () {
  var box = document.getElementById('install'), prompt = null;
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (standalone) return;
  function draw() {
    if (prompt) { box.innerHTML = '<button class="btn block primary" id="inst-btn" style="min-height:52px">' + icon('save') + ' Installeer Uni Study als app</button>';
      document.getElementById('inst-btn').onclick = function () { prompt.prompt(); prompt.userChoice.then(function () { prompt = null; box.innerHTML = ''; }, function () {}); }; }
    else if (ios) box.innerHTML = '<p class="alert"><span>' + icon('save') + '</span><span><b>Installeren op iPhone:</b> tik in Safari op het deel-icoon en kies <b>Zet op beginscherm</b>.</span></p>';
    else box.innerHTML = '';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); prompt = e; draw(); });
  window.addEventListener('appinstalled', function () { prompt = null; box.innerHTML = ''; });
  draw();
})();
</script>
</body>
</html>
